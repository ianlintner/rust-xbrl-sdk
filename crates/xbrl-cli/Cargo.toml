[package]
name = "xbrl-cli"
description = "Command-line front end (`xbrl`) for the Rust XBRL SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xbrl"
path = "src/main.rs"

# CLI wiring for PLAN.md milestone 7. `xbrl-cli` is a terminal crate: it drives
# parse (xbrl-xml), DTS discovery (xbrl-taxonomy), validation (xbrl-validate)
# and rendering (xbrl-render) over the typed model in xbrl-core. The dependency
# edges all point downward, so no cycle is introduced (docs/architecture.md).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xbrl-core.workspace = true
xbrl-xml.workspace = true
xbrl-taxonomy.workspace = true
xbrl-validate.workspace = true
xbrl-render.workspace = true
