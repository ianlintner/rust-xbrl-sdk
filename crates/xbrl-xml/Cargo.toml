[package]
name = "xbrl-xml"
description = "XBRL 2.1 XML syntax layer: bounded namespace-aware streaming reader and local-only URI/catalog resolver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# PLAN.md milestone 2; see docs/architecture.md. quick-xml only tokenizes: all
# namespace, entity, DOCTYPE and limit policy lives in this crate.
[dependencies]
quick-xml = "0.41.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
xbrl-core.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
